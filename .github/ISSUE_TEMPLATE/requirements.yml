name: Requirements
description: Submit a product or technical requirement
title: '[Requirement] '
labels:
    - documentation
body:
    - type: textarea
      id: requirement
      attributes:
          label: Requirement details
          description: Describe the requirement and acceptance criteria in Markdown. Attach relevant files or images.
          render: markdown
          placeholder: Describe the requirement and expected outcome.
      validations:
          required: true
    - type: checkboxes
      id: scopes
      attributes:
          label: Development scopes
          description: Select every scaffold directory affected by this requirement.
          options:
              - label: server
              - label: browser
              - label: mobile
      validations:
          required: true
    - type: dropdown
      id: engine
      attributes:
          label: AI agent
          description: Select the coding agent for the generated task issues.
          options:
              - Copilot
              - Claude Code
              - Gemini CLI
              - OpenAI Codex
              - Kimi CLI
      validations:
          required: true
