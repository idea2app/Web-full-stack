name: Route issues to the selected agent

on:
    issues:
        types:
            - opened
            - closed

permissions:
    actions: write
    contents: read
    issues: write

jobs:
    assign:
        if: >-
            ${{
              (github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'documentation')) ||
              github.event.action == 'closed'
            }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Assign issue to Copilot
              run: >-
                  pnpm exec zx script/assign-issue.ts
                  "${{ github.event.issue.number }}"
                  "${{ github.event.action }}"
                  "${{ github.event.repository.default_branch }}"
              env:
                  GH_TOKEN: ${{ github.token }}
