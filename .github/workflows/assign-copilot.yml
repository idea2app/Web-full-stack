name: Route issues to the selected agent

on:
    issues:
        types:
            - opened
            - reopened
            - closed

permissions:
    actions: write
    contents: read
    issues: write

jobs:
    assign:
        if: >-
            ${{
              ((github.event.action == 'opened' || github.event.action == 'reopened') && !contains(github.event.issue.labels.*.name, 'documentation')) ||
              (github.event.action == 'closed' && github.event.issue.state_reason == 'completed')
            }}
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - run: pnpm install --no-frozen-lockfile

            - name: Assign issue to Copilot
              run: >-
                  pnpm exec zx script/assign-issue.ts
                  "$ISSUE_NUMBER"
                  "$ISSUE_ACTION"
                  "$DEFAULT_BRANCH"
              env:
                  GH_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_ACTION: ${{ github.event.action }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
