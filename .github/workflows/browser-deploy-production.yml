name: Deploy browser scaffold

on:
    push:
        branches:
            - main
        paths:
            - 'browser/**'
            - '.github/workflows/browser-deploy-production.yml'

permissions:
    contents: read

env:
    ARTIFACT_PATH: /tmp/artifact.tar
    BOX_URL: idea2app/next-bootstrap-ts
    HOST: ${{ secrets.HOST }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: docker/setup-qemu-action@v4.4.0
            - uses: docker/setup-buildx-action@v4.4.1

            - name: Build image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: ./browser
                  file: ./browser/Dockerfile
                  platforms: linux/amd64
                  tags: ${{ env.BOX_URL }}:latest
                  outputs: type=docker,dest=${{ env.ARTIFACT_PATH }}

            - name: Prepare deployment files
              env:
                  ENV_FILE: ${{ secrets.ENV_FILE }}
              run: |
                  umask 077
                  mkdir ./build
                  mv "$ARTIFACT_PATH" ./browser/docker-compose.yml ./browser/start.sh ./build
                  python3 - <<'PY'
                  from pathlib import Path

                  compose = Path("build/docker-compose.yml")
                  content = compose.read_text(encoding="utf-8")
                  marker = "    environment:\n"
                  if marker not in content:
                      raise SystemExit("Could not locate the browser service environment.")
                  compose.write_text(
                      content.replace(
                          marker, "    env_file:\n      - .env.local\n" + marker, 1
                      ),
                      encoding="utf-8",
                  )
                  PY
                  printf '%s\n' "$ENV_FILE" > ./build/runtime.env

            - name: Transport image
              if: ${{ env.HOST }}
              uses: garygrossgarten/github-action-scp@0.10.0
              with:
                  local: ./build
                  remote: /tmp
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  privateKey: ${{ secrets.SSH_KEY }}

            - name: Run image
              if: ${{ env.HOST }}
              uses: garygrossgarten/github-action-ssh@0.9.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  privateKey: ${{ secrets.SSH_KEY }}
                  command: |
                      mv /tmp/docker-compose.yml /tmp/start.sh /tmp/runtime.env ~/
                      mv ~/runtime.env ~/.env.local
                      cd ~
                      chmod +x ~/start.sh
                      ~/start.sh /tmp/artifact.tar
