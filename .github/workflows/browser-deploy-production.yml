name: Deploy browser container

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'browser'
            - 'browser/**'
            - 'script/deploy-container.ts'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/browser-deploy-production.yml'

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install root automation dependencies
              run: pnpm install --filter integration-test --no-frozen-lockfile --ignore-scripts

            - name: Build and deploy browser container
              run: pnpm exec zx script/deploy-container.ts --scope browser
              env:
                  ENV_FILE: ${{ secrets.ENV_FILE }}
                  HOST: ${{ secrets.HOST }}
                  SSH_KEY: ${{ secrets.SSH_KEY }}
                  USER: ${{ secrets.USER }}
