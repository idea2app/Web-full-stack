name: Deploy browser previews

on:
    workflow_dispatch:
    push:
        branches:
            - '**'
        paths:
            - 'browser'
            - 'browser/**'
            - 'script/deploy-browser-vercel.ts'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/browser-main.yml'

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install root automation dependencies
              run: pnpm install --filter integration-test --no-frozen-lockfile --ignore-scripts

            - name: Deploy browser preview or production
              run: pnpm exec zx script/deploy-browser-vercel.ts
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
