name: Implement issues with selected AI CLI

on:
    issues:
        types:
            - opened
    workflow_dispatch:
        inputs:
            issue_number:
                description: Issue number to implement
                required: true
                type: string

permissions:
    contents: write
    issues: read
    pull-requests: write

concurrency:
    group: issue-agent-${{ github.event.issue.number || inputs.issue_number }}
    cancel-in-progress: false

jobs:
    implement:
        if: >-
            ${{
              github.event_name == 'workflow_dispatch' ||
              contains(github.event.issue.labels.*.name, 'agent-claude-code') ||
              contains(github.event.issue.labels.*.name, 'agent-gemini-cli') ||
              contains(github.event.issue.labels.*.name, 'agent-openai-codex') ||
              contains(github.event.issue.labels.*.name, 'agent-kimi-cli')
            }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.x'

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Read issue details
              run: gh issue view "$ISSUE_NUMBER" --json title,body,labels > "$ISSUE_DATA_FILE"
              env:
                  GH_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
                  ISSUE_DATA_FILE: ${{ runner.temp }}/issue.json

            - name: Install Kimi CLI
              run: |
                  if node -e "const i = require(process.argv[1]); process.exit(i.labels.some(({ name }) => name === 'agent-kimi-cli') ? 0 : 1)" "$ISSUE_DATA_FILE"; then
                      python -m pip install --user kimi-cli==1.52.0
                      echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  fi
              env:
                  ISSUE_DATA_FILE: ${{ runner.temp }}/issue.json

            - name: Implement the issue
              run: >-
                  pnpm exec zx script/implement-issue.ts
                  --issue-number "$ISSUE_NUMBER"
                  --issue-file "$ISSUE_DATA_FILE"
              env:
                  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
                  ISSUE_DATA_FILE: ${{ runner.temp }}/issue.json
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}

            - uses: peter-evans/create-pull-request@v8.1.3
              with:
                  token: ${{ github.token }}
                  branch: issue-${{ github.event.issue.number || inputs.issue_number }}
                  commit-message: 'feat: implement issue #${{ github.event.issue.number || inputs.issue_number }}'
                  title: 'feat: implement issue #${{ github.event.issue.number || inputs.issue_number }}'
                  body: 'Automated implementation for #${{ github.event.issue.number || inputs.issue_number }}.'
                  delete-branch: true
