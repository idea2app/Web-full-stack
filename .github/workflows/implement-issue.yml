name: Implement issues with selected AI CLI

on:
    workflow_dispatch:
        inputs:
            issue_number:
                type: string
                required: true
                description: Issue number to implement

permissions:
    contents: write
    issues: read
    pull-requests: write

concurrency:
    group: issue-agent-${{ inputs.issue_number }}
    cancel-in-progress: false

jobs:
    implement:
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - run: pnpm install --no-frozen-lockfile

            - name: Read issue details
              run: gh issue view "$ISSUE_NUMBER" --json title,body,labels > "$ISSUE_DATA_FILE"
              env:
                  GH_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ inputs.issue_number }}
                  ISSUE_DATA_FILE: ${{ runner.temp }}/issue.json

            - name: Select agent
              id: agent
              run: |
                  ENGINE=$(node --import @swc-node/register/esm-register --input-type=module -e '
                      import { readFileSync } from "node:fs";
                      import { findIssueAgent } from "./script/utility.ts";
                      const issue = JSON.parse(readFileSync(process.argv[1], "utf8"));
                      console.log(findIssueAgent(issue.labels.map(({ name }) => name)) ?? "copilot");
                  ' "$ISSUE_DATA_FILE")

                  echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
              env:
                  ISSUE_DATA_FILE: ${{ runner.temp }}/issue.json

            - uses: actions/setup-python@v7.1.0
              if: ${{ steps.agent.outputs.engine == 'kimi-cli' }}
              with:
                  python-version: '3.x'

            - name: Install Kimi CLI
              if: ${{ steps.agent.outputs.engine == 'kimi-cli' }}
              run: |
                  python -m pip install --user kimi-cli==1.52.0
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Implement the issue
              if: ${{ steps.agent.outputs.engine != 'copilot' }}
              run: >-
                  pnpm exec zx script/implement-issue.ts
                  --issue-number "$ISSUE_NUMBER"
                  --issue-file "$ISSUE_DATA_FILE"
              env:
                  ISSUE_NUMBER: ${{ inputs.issue_number }}
                  ISSUE_DATA_FILE: ${{ runner.temp }}/issue.json
                  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
                  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
                  KILO_CONFIG_CONTENT: ${{ secrets.KILO_CONFIG_CONTENT }}

            - uses: peter-evans/create-pull-request@v8.1.3
              if: ${{ steps.agent.outputs.engine != 'copilot' }}
              env:
                  GIT_CONFIG_COUNT: '1'
                  GIT_CONFIG_KEY_0: core.hooksPath
                  GIT_CONFIG_VALUE_0: /dev/null
              with:
                  token: ${{ github.token }}
                  branch: issue-${{ inputs.issue_number }}
                  commit-message: 'feat: implement issue #${{ inputs.issue_number }}'
                  title: 'feat: implement issue #${{ inputs.issue_number }}'
                  body: 'Automated implementation to resolve #${{ inputs.issue_number }}.'
                  delete-branch: true
