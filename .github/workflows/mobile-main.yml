name: Build and deploy mobile scaffold

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'mobile'
            - 'mobile/**'
            - 'script/deploy-mobile.ts'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/mobile-main.yml'

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            WMA_ID: ${{ secrets.WMA_ID }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install root automation dependencies
              run: pnpm install --filter integration-test --no-frozen-lockfile --ignore-scripts

            - name: Build mobile application
              id: build
              if: ${{ env.WMA_ID }}
              run: pnpm exec zx script/deploy-mobile.ts

            - uses: actions/upload-artifact@v7.0.2
              if: ${{ env.WMA_ID }}
              with:
                  name: Taro-miniapp-${{ steps.build.outputs.package-version }}-bundle
                  path: ./mobile/dist/wx/

            - name: Upload to WeChat
              if: ${{ env.WMA_ID }}
              run: pnpm exec zx script/upload-mobile.ts
              env:
                  WMA_UPLOAD_KEY: ${{ secrets.WMA_UPLOAD_KEY }}
