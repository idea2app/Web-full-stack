name: Mobile scaffold CI and deployment

on:
    push:
        branches:
            - main
        paths:
            - 'mobile/**'
            - '.github/workflows/mobile-main.yml'

permissions:
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile
        env:
            WMA_ID: ${{ secrets.WMA_ID }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.15.0

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
                  cache-dependency-path: mobile/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build WeChat version
              if: ${{ env.WMA_ID }}
              run: pnpm build-wx
              env:
                  NODE_ENV: production

            - name: Get package version
              if: ${{ env.WMA_ID }}
              id: package-version
              run: |
                  version=$(node -p "require('./package.json').version")
                  echo "current-version=$version" >> "$GITHUB_OUTPUT"

            - name: Upload artifact
              if: ${{ env.WMA_ID }}
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: Taro-miniapp-${{ steps.package-version.outputs.current-version }}-bundle
                  path: ./mobile/dist/wx/

            - name: Upload to WeChat
              if: ${{ env.WMA_ID }}
              env:
                  WMA_UPLOAD_KEY: ${{ secrets.WMA_UPLOAD_KEY }}
              run: |
                  trap 'rm -f WMA-upload.key' EXIT
                  printf '%s' "$WMA_UPLOAD_KEY" > WMA-upload.key
                  pnpx miniprogram-ci upload \
                    --pp ./ \
                    --pkp ./WMA-upload.key \
                    --appid "$WMA_ID" \
                    --uv "${{ steps.package-version.outputs.current-version }}"
