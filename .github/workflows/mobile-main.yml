name: Mobile scaffold CI and deployment

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'mobile'
            - 'mobile/**'
            - '.github/workflows/mobile-main.yml'

permissions:
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile
        env:
            WMA_ID: ${{ secrets.WMA_ID }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26
                  cache: pnpm
                  cache-dependency-path: mobile/pnpm-lock.yaml

            - name: Install automation dependencies
              working-directory: .
              run: pnpm install --frozen-lockfile

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build WeChat version
              if: ${{ env.WMA_ID }}
              run: pnpm build-wx
              env:
                  NODE_ENV: production

            - name: Get package version
              if: ${{ env.WMA_ID }}
              id: package-version
              working-directory: .
              run: pnpm exec zx script/set-package-version.ts
              env:
                  PACKAGE_JSON_PATH: mobile/package.json

            - name: Upload artifact
              if: ${{ env.WMA_ID }}
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: Taro-miniapp-${{ steps.package-version.outputs.current-version }}-bundle
                  path: ./mobile/dist/wx/

            - name: Upload to WeChat
              if: ${{ env.WMA_ID }}
              working-directory: .
              run: pnpm exec zx script/upload-mobile.ts
              env:
                  PACKAGE_VERSION: ${{ steps.package-version.outputs.current-version }}
                  WMA_UPLOAD_KEY: ${{ secrets.WMA_UPLOAD_KEY }}
