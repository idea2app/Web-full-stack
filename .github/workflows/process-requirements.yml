name: Create documentation task issues

on:
    issues:
        types:
            - closed
    push:
        branches:
            - main
        paths:
            - 'documents/**/tasks.yml'
    workflow_dispatch:

permissions:
    actions: write
    contents: write
    issues: write

concurrency:
    group: requirement-tasks
    cancel-in-progress: false

jobs:
    create-issues:
        if: ${{ github.event_name != 'issues' || github.event.issue.state_reason == 'completed' }}
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
        steps:
            - uses: actions/checkout@v7.0.1
              id: checkout

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - run: pnpm install --no-frozen-lockfile

            - name: Create task issues for closed requirements
              run: >-
                  pnpm exec zx script/process-tasks.ts
                  --default-branch "$DEFAULT_BRANCH"
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

            - name: Commit task issue URLs to the default branch
              if: always() && steps.checkout.outcome == 'success'
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  file_pattern: 'documents/**/tasks.yml'
                  commit_message: |-
                      docs: record generated task issue URLs

                      Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
