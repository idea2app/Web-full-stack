name: Create documentation task issues

on:
    issues:
        types:
            - closed
    push:
        branches:
            - main
        paths:
            - 'documents/**/tasks.yml'

permissions:
    actions: write
    contents: write
    issues: write
    pull-requests: write

concurrency:
    group: requirement-tasks
    cancel-in-progress: false

jobs:
    create-issues:
        if: ${{ github.event_name != 'issues' || github.event.issue.state_reason == 'completed' }}
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
        steps:
            - uses: actions/checkout@v7.0.1
              id: checkout

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - run: pnpm install --no-frozen-lockfile

            - name: Create task issues for closed requirements
              run: >-
                  pnpm exec zx script/process-tasks.ts
                  --default-branch "$DEFAULT_BRANCH"
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

            - uses: peter-evans/create-pull-request@v8.1.3
              if: always() && steps.checkout.outcome == 'success'
              env:
                  GIT_CONFIG_COUNT: '1'
                  GIT_CONFIG_KEY_0: core.hooksPath
                  GIT_CONFIG_VALUE_0: /dev/null
              with:
                  add-paths: documents/
                  branch: requirements/task-issues
                  commit-message: 'docs: record generated task issue numbers'
                  title: 'docs: record generated task issue numbers'
                  body: 'Record child issue numbers in the corresponding requirement task files.'
                  delete-branch: true
