name: Prepare documentation requirement

on:
    issues:
        types:
            - opened

permissions:
    contents: write
    issues: write
    pull-requests: write

concurrency:
    group: requirement-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    prepare:
        if: ${{ contains(github.event.issue.labels.*.name, 'documentation') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: actions/setup-python@v7.1.0
              with:
                  python-version: '3.x'

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - uses: stefanbuck/github-issue-parser@v3.2.5
              id: parse
              with:
                  template-path: .github/ISSUE_TEMPLATE/requirements.yml

            - name: Install Kimi CLI when selected
              if: ${{ steps.parse.outputs.issueparser_engine == 'Kimi CLI' }}
              run: |
                  python -m pip install --user kimi-cli==1.52.0
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Textify the requirement and attachments
              run: >-
                  pnpm exec zx script/prepare-requirement.ts
                  --issue-number "$ISSUE_NUMBER"
                  --issue-title "$ISSUE_TITLE"
                  --issue-body "$ISSUE_BODY"
                  --fields "$ISSUE_FIELDS"
              env:
                  GH_TOKEN: ${{ github.token }}
                  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_TITLE: ${{ github.event.issue.title }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_FIELDS: ${{ steps.parse.outputs.jsonString }}

            - uses: peter-evans/create-pull-request@v8.1.3
              with:
                  add-paths: |
                      document/
                      task.yml
                  branch: requirements/issue-${{ github.event.issue.number }}
                  commit-message: 'docs: prepare requirement #${{ github.event.issue.number }}'
                  title: 'docs: prepare requirement #${{ github.event.issue.number }}'
                  body: 'Textify the requirement and attachments, then queue task analysis after merge.'
                  delete-branch: true
