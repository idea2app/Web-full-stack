name: Process documentation requirements

on:
    issues:
        types:
            - opened

permissions:
    contents: read
    issues: read

concurrency:
    group: requirement-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    generate:
        if: ${{ contains(github.event.issue.labels.*.name, 'documentation') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare the requirement and attachments
              run: pnpm exec zx script/prepare-requirement.ts
              env:
                  COPILOT_GITHUB_TOKEN: ${{ github.token }}

            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: requirement-plan
                  path: ${{ runner.temp }}/issue-input/plan.json
                  if-no-files-found: error
                  retention-days: 1

    apply:
        needs: generate
        if: ${{ contains(github.event.issue.labels.*.name, 'documentation') }}
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            issues: write
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  submodules: recursive

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - uses: actions/download-artifact@v8.0.2
              with:
                  name: requirement-plan
                  path: ${{ runner.temp }}/requirement-plan

            - name: Validate the plan and write the requirement document
              id: validate
              run: pnpm exec zx script/validate-requirement.ts
              env:
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_TITLE: ${{ github.event.issue.title }}
                  RUNNER_TEMP: ${{ runner.temp }}

            - name: Commit the requirement document
              run: pnpm exec zx script/commit-requirement.ts
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  DOCUMENT_PATH: ${{ steps.validate.outputs.document_path }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}

            - name: Create task issues and associate dependencies
              run: pnpm exec zx script/create-task-issues.ts
              env:
                  GH_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}

            - name: Vendor the selected scaffold as regular files
              run: pnpm exec zx script/vendor-scaffold.ts
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  GH_TOKEN: ${{ github.token }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  SCOPE: ${{ steps.validate.outputs.scope }}
