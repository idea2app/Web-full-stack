name: Prepare documentation requirement

on:
    issues:
        types:
            - opened
            - reopened

permissions:
    contents: write
    copilot-requests: write
    issues: write
    pull-requests: write

concurrency:
    group: requirement-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    prepare:
        if: ${{ contains(github.event.issue.labels.*.name, 'documentation') }}
        runs-on: ubuntu-latest
        env:
            PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - uses: stefanbuck/github-issue-parser@v3.2.5
              id: parse
              with:
                  template-path: .github/ISSUE_TEMPLATE/requirements.yml

            - uses: actions/setup-python@v7.1.0
              if: ${{ steps.parse.outputs.issueparser_engine == 'Kimi CLI' }}
              with:
                  python-version: '3.x'

            - name: Install Kimi CLI when selected
              if: ${{ steps.parse.outputs.issueparser_engine == 'Kimi CLI' }}
              run: |
                  python -m pip install --user kimi-cli==1.52.0
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Convert requirement and split tasks
              id: prepare
              run: >-
                  pnpm exec zx script/prepare-requirement.ts
                  --issue-number "$ISSUE_NUMBER"
                  --issue-url "$ISSUE_URL"
                  --issue-title "$ISSUE_TITLE"
                  --issue-body "$ISSUE_BODY"
                  --fields "$ISSUE_FIELDS"
              env:
                  GH_TOKEN: ${{ github.token }}
                  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
                  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
                  KILO_CONFIG_CONTENT: ${{ secrets.KILO_CONFIG_CONTENT }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_URL: ${{ github.event.issue.html_url }}
                  ISSUE_TITLE: ${{ github.event.issue.title }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_FIELDS: ${{ steps.parse.outputs.jsonString }}

            - name: Localize selected scaffold code
              run: pnpm exec zx script/vendor-scaffold.ts --scopes "$SCOPES"
              env:
                  SCOPES: ${{ steps.prepare.outputs.scopes }}

            - uses: peter-evans/create-pull-request@v8.1.3
              env:
                  GIT_CONFIG_COUNT: '1'
                  GIT_CONFIG_KEY_0: core.hooksPath
                  GIT_CONFIG_VALUE_0: /dev/null
              with:
                  add-paths: |
                      .gitmodules
                      documents/
                      pnpm-lock.yaml
                      server/
                      browser/
                      mobile/
                  branch: requirements/issue-${{ github.event.issue.number }}
                  commit-message: 'docs: prepare requirement #${{ github.event.issue.number }}'
                  title: 'docs: prepare requirement #${{ github.event.issue.number }}'
                  body: |
                      ${{ steps.prepare.outputs.complete == 'true' && format('Closes #{0}', github.event.issue.number) || format('Partial task breakdown for #{0}; complete the task list and set status to pending before closing.', github.event.issue.number) }}

                      Textify the requirement and attachments, split the tasks, and localize selected scaffold code.
                  delete-branch: true
