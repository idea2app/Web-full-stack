name: Deploy server scaffold

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'server'
            - 'server/**'
            - '.github/workflows/server-deploy-production.yml'

permissions:
    contents: read

env:
    ARTIFACT_PATH: /tmp/artifact.tar
    BOX_URL: idea2app/rest-node-ts
    HOST: ${{ secrets.HOST }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: recursive

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - uses: docker/setup-qemu-action@v4.4.0
            - uses: docker/setup-buildx-action@v4.4.1

            - name: Build image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: ./server
                  file: ./server/Dockerfile
                  platforms: linux/amd64
                  tags: ${{ env.BOX_URL }}:latest
                  outputs: type=docker,dest=${{ env.ARTIFACT_PATH }}

            - name: Prepare deployment files
              run: pnpm exec zx script/prepare-server-deployment.ts
              env:
                  APP_SECRET: ${{ secrets.APP_SECRET }}

            - name: Transport image
              if: ${{ env.HOST }}
              uses: garygrossgarten/github-action-scp@0.10.0
              with:
                  local: ./build
                  remote: /tmp
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  privateKey: ${{ secrets.SSH_KEY }}

            - name: Run image
              if: ${{ env.HOST }}
              uses: garygrossgarten/github-action-ssh@0.9.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USER }}
                  privateKey: ${{ secrets.SSH_KEY }}
                  command: |
                      mv /tmp/docker-compose.yml /tmp/start.sh /tmp/runtime.env ~/
                      mv ~/runtime.env ~/.env
                      cd ~
                      chmod +x ~/start.sh
                      sudo ~/start.sh /tmp/artifact.tar
