name: Update scaffold submodules

on:
    schedule:
        - cron: '0 0 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Update submodules
              run: git submodule update --remote --recursive

            - name: Create or update pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git add -- .gitmodules server browser mobile
                  if git diff --cached --quiet; then
                    echo "Submodules are already up to date."
                    exit 0
                  fi

                  branch=automation/update-submodules
                  git switch --create "$branch"
                  git commit -m "chore: update scaffold submodules"

                  if git fetch origin "$branch"; then
                    expected=$(git rev-parse FETCH_HEAD)
                    git push --force-with-lease="refs/heads/$branch:$expected" origin "HEAD:$branch"
                  else
                    git push origin "HEAD:$branch"
                  fi

                  pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
                  if [ -z "$pr" ]; then
                    gh pr create \
                      --base "$DEFAULT_BRANCH" \
                      --head "$branch" \
                      --title "chore: update scaffold submodules" \
                      --body "Updates the server, browser, and mobile scaffold submodules." \
                      --reviewer idea2app/team-1
                  else
                    gh pr edit "$pr" --add-reviewer idea2app/team-1
                  fi
