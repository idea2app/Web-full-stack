name: Update scaffold submodules

on:
    schedule:
        - cron: '0 0 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  submodules: recursive

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26

            - uses: pnpm/action-setup@v6.1.1
              with:
                  version: 12.21.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Update submodules and request review
              run: pnpm exec zx script/update-submodules.ts
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
