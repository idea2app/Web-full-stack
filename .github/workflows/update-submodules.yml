name: Update scaffold submodules

on:
    schedule:
        - cron: '0 0 * * 1'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Update scaffold submodules
              run: git submodule update --remote --recursive

            - uses: peter-evans/create-pull-request@v8.1.3
              with:
                  branch: automation/update-submodules
                  commit-message: 'chore: update scaffold submodules'
                  title: 'chore: update scaffold submodules'
                  body: 'Updates the server, browser, and mobile scaffold submodules.'
                  reviewers: idea2app/team-1
                  delete-branch: true
